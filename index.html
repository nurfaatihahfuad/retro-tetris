<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DECKER TETRIS 1-BIT</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        /* CSS RETRO DECKER */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'VT323', monospace; }
        body { 
            background: #fff; 
            background-image: radial-gradient(#000 0.5px, transparent 0.5px);
            background-size: 4px 4px;
            display: flex; justify-content: center; align-items: center; height: 100vh;
            overflow: hidden; touch-action: none;
        }
        .container {
            background: #fff; border: 4px solid #000; padding: 20px;
            box-shadow: 10px 10px 0px #000; text-align: center;
        }
        h1 { background: #000; color: #fff; padding: 5px; margin-bottom: 10px; font-size: 2rem; }
        .game-wrapper { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        canvas { 
            border: 4px solid #000; background: #fff; 
            box-shadow: 5px 5px 0px #000; width: 240px; height: 400px;
        }
        .stats { border: 3px solid #000; padding: 10px; width: 100%; font-size: 1.5rem; }
        #start-btn {
            background: #fff; border: 3px solid #000; padding: 10px 20px;
            cursor: pointer; box-shadow: 4px 4px 0px #000; font-size: 1.5rem;
            margin-top: 10px; width: 100%;
        }
        #start-btn:active { transform: translate(4px, 4px); box-shadow: none; }
        @media (min-width: 600px) { .game-wrapper { flex-direction: row; } }
    </style>
</head>
<body>

    <div class="container">
        <h1>TETRIS.EXE</h1>
        <div class="game-wrapper">
            <canvas id="tetris" width="240" height="400"></canvas>
            
            <div class="side-panel">
                <div class="stats">
                    <p>SCORE</p>
                    <span id="score">0</span>
                </div>
                <button id="start-btn">RUN GAME</button>
            </div>
        </div>
        <p style="margin-top:15px; font-size:1rem;">SWIPE TO MOVE • UP TO ROTATE</p>
    </div>

    <script src="tetris.js"></script>
</body>
</html>
